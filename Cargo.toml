[package]
name = "lacakwangrust"
version = "1.0.0"
edition = "2021"
description = "Lacakuang - Pencatatan Keuangan Sederhana (Native Desktop, Rust + egui)"
authors = ["Athailah (tuxkeren)"]

[dependencies]
# GUI native (tanpa webview). Memakai backend OpenGL (glow) agar ringan & kompatibel.
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
    # Agar tautan di dialog "Tentang" bisa dibuka di peramban bawaan sistem.
    "links",
] }
egui = "0.36.2"

# Database SQLite (sama seperti versi PHP), library SQLite di-bundle agar tidak perlu install sistem.
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Tanggal & waktu
chrono = "0.4.45"
printpdf = "0.7"

# Dialog "Simpan Sebagai" bawaan sistem (Linux: xdg-portal/D-Bus, Windows: dialog file Windows).
# Tidak butuh GTK: backend Linux memakai portal, bukan gtk3.
rfd = "0.15"

[build-dependencies]
# Dipakai `build.rs` untuk menyisipkan ikon & metadata ke .exe Windows.
# Pada target non-Windows tidak dijalankan (lihat build.rs).
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
